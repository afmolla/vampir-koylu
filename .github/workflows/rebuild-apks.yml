# v0.2.3 APK build tetikler (workflow dosyasi degisince).

name: Rebuild Missing APKs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-release.yml'
      - '.github/workflows/rebuild-apks.yml'
      - 'mobile/pubspec.yaml'
      - 'mobile/android/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: write

jobs:
  trigger-v023:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'android-release.yml',
              ref: 'main',
              inputs: {
                tag: 'v0.2.15',
                checkout_ref: 'main',
                api_base_url: 'http://85.95.251.204:3002',
              },
            });
            core.info('Triggered android-release for v0.2.15');
