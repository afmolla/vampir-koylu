name: Android APK Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Build edilecek tag (ornek v0.1.9, v0.2.2)'
        required: false
        default: 'v0.2.25'
      api_base_url:
        description: 'API_BASE_URL (sunucu)'
        required: false
        default: 'http://85.95.251.204:3002'
      checkout_ref:
        description: 'Git ref (main veya tag)'
        required: false
        default: 'main'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Resolve ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            REF="${{ github.event.inputs.checkout_ref }}"
            if [ -z "$REF" ]; then REF="main"; fi
            echo "ref=$REF" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install dependencies & l10n
        working-directory: mobile
        run: |
          flutter --version
          flutter pub get
          flutter gen-l10n --verbose

      - name: Verify permanent release keystore (sabit imza)
        run: |
          test -f mobile/android/signing/release.keystore || (echo "release.keystore repoda olmali" && exit 1)
          chmod +x mobile/android/signing/setup-ci-keystore.sh
          bash mobile/android/signing/setup-ci-keystore.sh

      - name: Build APK
        working-directory: mobile
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url || 'http://85.95.251.204:3002' }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          GRADLE_OPTS: -Xmx4g
        run: |
          set -o pipefail
          echo "Building tag=${{ steps.ref.outputs.tag }} API_BASE_URL=$API_BASE_URL"
          flutter doctor -v
          DART_DEFINES="--dart-define=API_BASE_URL=$API_BASE_URL"
          if [ -n "$GOOGLE_SERVER_CLIENT_ID" ]; then
            DART_DEFINES="$DART_DEFINES --dart-define=GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID"
          fi
          flutter build apk --release $DART_DEFINES 2>&1 | tee ../build-apk.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-apk-log-${{ steps.ref.outputs.tag }}
          path: build-apk.log
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vampir-koylu-apk-${{ steps.ref.outputs.tag }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ref.outputs.tag }}
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
