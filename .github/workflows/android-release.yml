name: Android APK Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API_BASE_URL (sunucu)'
        required: false
        default: 'http://85.95.251.204:3000'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Restore release keystore
        uses: actions/cache@v4
        id: release-keystore
        with:
          path: mobile/android/signing/release.keystore
          key: vampir-release-keystore-v1

      - name: Create release keystore (ilk kurulum / cache yoksa)
        if: steps.release-keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p mobile/android/signing
          keytool -genkeypair -v \
            -keystore mobile/android/signing/release.keystore \
            -alias vampir \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "vampir_koylu_store" \
            -keypass "vampir_koylu_key" \
            -dname "CN=Vampir Koylu, OU=Mobile, O=MollaYazilim, L=Istanbul, ST=TR, C=TR"

      - name: Install dependencies & l10n
        working-directory: mobile
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Build APK
        working-directory: mobile
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url || 'http://85.95.251.204:3000' }}
        run: |
          echo "Building with API_BASE_URL=$API_BASE_URL"
          flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Upload APK artifact (her zaman)
        uses: actions/upload-artifact@v4
        with:
          name: vampir-koylu-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
