name: Cleanup Old Releases

# Eski APK release'lerini siler; sadece v0.1.8, v0.1.9, v0.2.2 kalir.
# Calistir: Actions → Cleanup Old Releases → Run workflow

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const keep = new Set(['v0.1.8', 'v0.1.9', 'v0.2.2']);
            const deleteTags = [
              'v0.1.0', 'v0.1.1', 'v0.1.2', 'v0.1.3', 'v0.1.4',
              'v0.1.5', 'v0.1.6', 'v0.1.7',
            ];

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo, per_page: 100 }
            );

            for (const release of releases) {
              if (keep.has(release.tag_name)) {
                core.info(`Keep release: ${release.tag_name}`);
                continue;
              }
              core.info(`Delete release: ${release.tag_name}`);
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: release.id,
              });
            }

            for (const tag of deleteTags) {
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `tags/${tag}`,
                });
                core.info(`Deleted tag: ${tag}`);
              } catch (e) {
                core.warning(`Tag ${tag}: ${e.message}`);
              }
            }
